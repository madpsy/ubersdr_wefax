services:
  ubersdr_wefax:
    image: madpsy/ubersdr_wefax:latest
    container_name: wefax
    restart: unless-stopped
    environment:
      # UberSDR WebSocket URL
      UBERSDR_URL: "ws://ubersdr:8080/ws"
      # Comma-separated freq:mode pairs, e.g. 7880000:usb,13882500:usb,4610000:usb
      UBERSDR_CHANNELS: "7880000:usb"
      # Uncomment and set as needed:
      # UBERSDR_PASS: ""
      # OUTPUT_DIR: "/data"
      # WEB_PORT: "6094"
      # LPM: "120"          # Lines per minute: 120 (default) or 60
      # IMAGE_WIDTH: "1809" # 1809 = IOC-576 (default), 904 = IOC-288
      # NO_PHASING: "0"     # Set to 1 to disable horizontal phasing sync
      # NO_AUTOSTOP: "0"    # Set to 1 to disable auto-stop on STOP tone
      # NO_AUTOSTART: "0"   # Set to 1 to disable auto-start on START tone
    ports:
      - "6094:6094"
    networks:
      - sdr-network
    volumes:
      - ./wefax-images:/data

networks:
  sdr-network:
    external: true
    name: ubersdr_sdr-network
