<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UberSDR WEFAX</title>
  <script>window.BASE_PATH = "{{.BasePath}}";</script>
  <link rel="stylesheet" href="{{.BasePath}}/static/style.css" />
</head>
<body>
  <header>
    <div id="header-left">
      <span id="app-title">📠 UberSDR WEFAX</span>
    </div>
    <div id="header-right">
      <div id="channel-selector-wrap">
        <label for="channel-select">Channel:</label>
        <select id="channel-select">
          <option value="">— all —</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Channel status badges — own row below header so they never overlap content -->
  <div id="badges-bar">
    <div id="status-badges" aria-live="polite"></div>
  </div>

  <div class="main-layout">
    <!-- ── Left: gallery of completed images ── -->
    <div id="gallery-panel">
      <div id="gallery-header">
        <span id="gallery-title">Received Images</span>
        <span id="gallery-count"></span>
      </div>
      <div id="gallery-list">
        <!-- thumb cards injected here -->
      </div>
      <div id="gallery-load-more">
        <button id="btn-load-more">Load more</button>
      </div>
    </div>

    <!-- ── Centre: live fax strip + detail viewer ── -->
    <div id="detail-panel">
      <!-- Live receive strip -->
      <div id="live-panel">
        <div id="live-header">
          <span id="live-label">Waiting for signal…</span>
          <span id="live-line-count"></span>
        </div>
        <div id="live-canvas-wrap">
          <canvas id="live-canvas"></canvas>
        </div>
      </div>

      <!-- Lightbox / detail view for completed images -->
      <div id="detail-view" class="hidden">
        <div id="detail-nav">
          <button id="btn-prev" title="Previous">&#8592;</button>
          <button id="btn-close-detail" title="Close">✕</button>
          <button id="btn-next" title="Next">&#8594;</button>
        </div>
        <div id="detail-image-wrap">
          <img id="detail-img" src="" alt="Fax image" />
        </div>
        <div id="detail-meta">
          <table id="detail-meta-table"></table>
        </div>
        <div id="detail-actions">
          <button id="btn-delete" class="danger">Delete</button>
        </div>
      </div>
    </div>

    <!-- ── Right: audio preview panel ── -->
    <div id="audio-panel">
      <div id="audio-panel-header">Audio Preview</div>
      <div id="audio-channel-wrap">
        <label for="audio-channel-select">Channel:</label>
        <select id="audio-channel-select">
          <option value="">— select —</option>
        </select>
      </div>
      <div id="audio-controls">
        <button id="btn-audio-mute" disabled title="Unmute audio output">🔇 Muted</button>
      </div>

      <!-- SNR display (always shown when a channel is selected) -->
      <div id="snr-display">
        <div id="snr-row">
          <span class="snr-label">SNR</span>
          <span id="snr-value">—</span>
        </div>
        <div id="snr-bar-wrap">
          <div id="snr-bar"></div>
        </div>
      </div>

      <!-- Frequency marker ticks above spectrum -->
      <canvas id="marker-spectrum" width="200" height="8"></canvas>

      <!-- FFT spectrum display -->
      <canvas id="spectrum-canvas" width="200" height="80"></canvas>

      <!-- Frequency marker ticks above waterfall -->
      <canvas id="marker-waterfall" width="200" height="8"></canvas>

      <!-- Scrolling waterfall -->
      <canvas id="waterfall-canvas" width="200" height="160"></canvas>

      <!-- VU meter -->
      <div id="vu-wrap">
        <div id="vu-label">VOL</div>
        <div id="vu-track">
          <div id="vu-bar"></div>
        </div>
      </div>

      <!-- Display controls -->
      <div id="audio-panel-controls">
        <label title="Top of dB scale">Max dB
          <input id="ctrl-maxdb" type="number" min="-40" max="10" value="-25" step="1">
        </label>
        <label title="dB range shown">Range
          <input id="ctrl-range" type="number" min="10" max="100" value="60" step="1">
        </label>
      </div>
    </div>
  </div>

  <!-- Lightbox overlay -->
  <div id="lightbox" class="hidden" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div id="lightbox-body">
      <button id="lightbox-close" title="Close">✕</button>
      <img id="lightbox-img" src="" alt="" />
    </div>
  </div>

  <script src="{{.BasePath}}/static/app.js"></script>
</body>
</html>
