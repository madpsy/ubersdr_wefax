<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ubersdr_wefax</title>
  <script>window.BASE_PATH = "{{.BasePath}}";</script>
  <link rel="stylesheet" href="{{.BasePath}}/static/style.css" />
</head>
<body>
  <header>
    <div id="header-left">
      <span id="app-title">📠 ubersdr_wefax</span>
    </div>
    <div id="header-right">
      <div id="channel-selector-wrap">
        <label for="channel-select">Channel:</label>
        <select id="channel-select">
          <option value="">— all —</option>
        </select>
      </div>
      <div id="status-badges" aria-live="polite"></div>
    </div>
  </header>

  <div class="main-layout">
    <!-- ── Left: gallery of completed images ── -->
    <div id="gallery-panel">
      <div id="gallery-header">
        <span id="gallery-title">Received Images</span>
        <span id="gallery-count"></span>
      </div>
      <div id="gallery-list">
        <!-- thumb cards injected here -->
      </div>
      <div id="gallery-load-more">
        <button id="btn-load-more">Load more</button>
      </div>
    </div>

    <!-- ── Centre: live fax strip + detail viewer ── -->
    <div id="detail-panel">
      <!-- Live receive strip -->
      <div id="live-panel">
        <div id="live-header">
          <span id="live-label">Waiting for signal…</span>
          <span id="live-line-count"></span>
        </div>
        <div id="live-canvas-wrap">
          <canvas id="live-canvas"></canvas>
        </div>
      </div>

      <!-- Lightbox / detail view for completed images -->
      <div id="detail-view" class="hidden">
        <div id="detail-nav">
          <button id="btn-prev" title="Previous">&#8592;</button>
          <button id="btn-close-detail" title="Close">✕</button>
          <button id="btn-next" title="Next">&#8594;</button>
        </div>
        <div id="detail-image-wrap">
          <img id="detail-img" src="" alt="Fax image" />
        </div>
        <div id="detail-meta">
          <table id="detail-meta-table"></table>
        </div>
        <div id="detail-actions">
          <button id="btn-delete" class="danger">Delete</button>
        </div>
      </div>
    </div>

    <!-- ── Right: audio preview panel ── -->
    <div id="audio-panel">
      <div id="audio-panel-header">Audio Preview</div>
      <div id="audio-channel-wrap">
        <label for="audio-channel-select">Channel:</label>
        <select id="audio-channel-select">
          <option value="">— select —</option>
        </select>
      </div>
      <div id="audio-controls">
        <button id="btn-audio-play">▶ Play</button>
        <button id="btn-audio-stop" disabled>■ Stop</button>
      </div>
      <div id="vu-wrap">
        <canvas id="vu-canvas" width="200" height="40"></canvas>
      </div>
    </div>
  </div>

  <!-- Lightbox overlay -->
  <div id="lightbox" class="hidden" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div id="lightbox-body">
      <button id="lightbox-close" title="Close">✕</button>
      <img id="lightbox-img" src="" alt="" />
    </div>
  </div>

  <script src="{{.BasePath}}/static/app.js"></script>
</body>
</html>
